name: CI

on:
  push:
    branches:
      - main
      - "cleanup/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-only-random-looking-key-not-for-deployment
      FIREBASE_WEB_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run backend tests
        run: pytest tests/ -q

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InfecSure_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: InfecSure_Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
